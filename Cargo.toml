[workspace]
resolver = "3"
members = ["crates/core"]
# Les prototypes de `spikes/` ont leurs propres workspaces.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
# Licence non tranchée (architecture § 20) : champ `license` volontairement absent.

[workspace.dependencies]
# Versions vérifiées sur crates.io le 2026-10-19 (`cargo search` / `cargo info`).
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
uuid = "1.28.0"
tempfile = "3.27.0"
