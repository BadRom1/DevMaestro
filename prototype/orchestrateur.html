<title>Orchestrateur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : coque d'app desktop — barre de quotas en haut, arbre projets à gauche, session (terminal/diff/app/run/livraison) à droite ; vue B = kanban par statut. */
:root{
  --bg:#0f1218; --panel:#161a22; --panel-2:#1c212b; --sunk:#0b0d12; --line:#272d3a; --line-2:#323949;
  --fg:#dde2ec; --muted:#8a93a6; --faint:#5f6779;
  --accent:#86a8ff; --accent-ink:#0f1218;
  --wait:#f2a93b; --run:#55c4a2; --idle:#8a93a6; --done:#7fb069; --err:#ef6b6b;
  --add:#55c4a2; --del:#ef6b6b;
  --add-bg:color-mix(in srgb,var(--add) 13%,transparent); --del-bg:color-mix(in srgb,var(--del) 13%,transparent);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef1f6; --panel:#ffffff; --panel-2:#f3f5f9; --sunk:#f7f8fb; --line:#d9dee8; --line-2:#c9d0dc;
  --fg:#1a1f2c; --muted:#5b6476; --faint:#8b93a3;
  --accent:#2f5bd3; --accent-ink:#ffffff;
  --wait:#b26a00; --run:#11866a; --idle:#6b7385; --done:#3f7d2c; --err:#c33b3b;
  --add:#11866a; --del:#c33b3b;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eef1f6; --panel:#ffffff; --panel-2:#f3f5f9; --sunk:#f7f8fb; --line:#d9dee8; --line-2:#c9d0dc;
  --fg:#1a1f2c; --muted:#5b6476; --faint:#8b93a3;
  --accent:#2f5bd3; --accent-ink:#ffffff;
  --wait:#b26a00; --run:#11866a; --idle:#6b7385; --done:#3f7d2c; --err:#c33b3b;
  --add:#11866a; --del:#c33b3b;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted);font-weight:600}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--f-label);font-size:17px;letter-spacing:.02em}
.proto{font-size:11px;color:var(--muted);border:1px dashed var(--line-2);border-radius:99px;padding:1px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.quotas{display:flex;flex-wrap:wrap;gap:6px 18px}
.quota{display:grid;grid-template-columns:auto auto auto;align-items:center;gap:2px 8px;font-size:12px}
.quota .who{font-family:var(--f-label);font-weight:600;grid-row:span 2}
.quota .k{color:var(--muted)}
.quota .v{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.meter{display:inline-block;width:86px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;vertical-align:middle}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.hot{background:var(--wait)}
.meter i.crit{background:var(--err)}
.spacer{flex:1}
.pill-wait{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--wait);color:var(--wait);background:transparent;border-radius:99px;padding:3px 10px;font-weight:600}
.btn{border:1px solid var(--line-2);background:var(--panel-2);border-radius:var(--r);padding:5px 11px}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.warn{border-color:var(--wait);color:var(--wait);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:2px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Status glyphs: shape + color */
.st{display:inline-grid;place-items:center;width:14px;height:14px;flex:none;border-radius:50%;font-size:9px;font-weight:700;line-height:1}
.st.waiting{background:var(--wait);color:var(--bg);border-radius:3px}
.st.waiting::after{content:"!"}
.st.running{border:2px solid var(--run);border-top-color:transparent;animation:spin 1.1s linear infinite}
.st.idle{border:2px solid var(--idle)}
.st.done{background:var(--done);color:var(--bg)}
.st.done::after{content:"✓"}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){ .st.running,.cursor{animation:none!important} }

.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:99px;padding:0 7px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip.perso{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.chip.boulot{border-color:color-mix(in srgb,var(--done) 55%,var(--line))}
.chip.wt::before{content:"⑂";font-size:12px}
.chip.ok{color:var(--done);border-color:var(--done)}
.chip.bad{color:var(--err);border-color:var(--err)}
.chip.pend{color:var(--wait);border-color:var(--wait)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}

/* View A */
.viewA{display:grid;grid-template-columns:268px minmax(0,1fr);gap:12px;min-height:0}
.side{overflow:auto;padding:10px 6px 12px}
.side .cap{padding:2px 10px 8px;display:flex;justify-content:space-between;align-items:center}
.proj{margin-bottom:6px}
.proj-h{display:flex;align-items:center;gap:6px;padding:6px 10px 2px}
.proj-h b{font-weight:600}
.proj-h .count{margin-left:auto;color:var(--wait);font-size:12px;font-weight:600}
.proj-path{padding:0 10px 4px;font-family:var(--f-mono);font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:5px 10px 5px 16px;border-radius:5px}
.srow:hover{background:var(--panel-2)}
.srow[aria-current="true"]{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--accent)}
.srow .br{font-family:var(--f-mono);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .ago{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.srow .clean{margin-left:auto;font-size:11px;color:var(--wait)}
.old{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.old .srow .br{font-family:var(--f-body)}

.sess{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;overflow:hidden}
.sh{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.sh-1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sh-1 h2{margin:0;font-size:15px;font-weight:600;font-family:var(--f-mono)}
.sh-1 h2 span{color:var(--muted)}
.sh-2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sh-2 b{color:var(--fg);font-weight:500}
.sh .acts{margin-left:auto;display:flex;gap:6px}
select.mode{background:var(--panel-2);border:1px solid var(--line-2);border-radius:99px;padding:1px 6px;font-size:12px}
.issue-link{color:var(--accent);text-decoration:none}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{font-size:11px;border-radius:99px;padding:0 6px;background:var(--line);color:var(--fg);font-variant-numeric:tabular-nums}
.badge.bad{background:var(--err);color:var(--bg)}
.badge.wait{background:var(--wait);color:var(--bg)}
.content{min-height:0;overflow:auto}

/* Terminal */
.term{background:var(--sunk);height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
.term-out{overflow:auto;padding:14px 16px;font-family:var(--f-mono);font-size:12.5px;line-height:1.6}
.tl{white-space:pre-wrap;word-break:break-word}
.tl.user{background:var(--panel-2);border-left:2px solid var(--faint);padding:4px 10px;margin:10px 0 8px;color:var(--fg)}
.tl.user::before{content:"> ";color:var(--muted)}
.tl.claude::before{content:"● ";color:var(--fg)}
.tl.tool::before{content:"● ";color:var(--run)}
.tl.tool b{font-weight:500}
.tl.out{color:var(--muted);padding-left:16px}
.tl.out::before{content:"⎿  "}
.tl.sys{color:var(--faint)}
.tl.ok{color:var(--done)}
.tl.bad{color:var(--err)}
.cursor{display:inline-block;width:8px;height:14px;background:var(--fg);vertical-align:-2px;animation:pulse 1s steps(1) infinite}
.ask{margin:12px 0 4px;border:1px solid var(--wait);border-radius:var(--r);padding:10px 12px;background:color-mix(in srgb,var(--wait) 7%,var(--sunk));font-family:var(--f-body);font-size:13px;display:grid;gap:8px}
.ask .t{color:var(--wait);font-weight:600}
.ask code{font-family:var(--f-mono);font-size:12.5px;background:var(--panel-2);padding:2px 6px;border-radius:4px}
.ask .row{display:flex;flex-wrap:wrap;gap:6px}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.compose input{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line-2);border-radius:var(--r);padding:6px 10px;font-family:var(--f-mono);font-size:12.5px}

/* Diff review */
.diff{display:grid;grid-template-columns:230px minmax(0,1fr);height:100%;min-height:0}
.files{border-right:1px solid var(--line);overflow:auto;padding:8px 6px;display:flex;flex-direction:column;gap:2px}
.frow{display:flex;align-items:center;gap:6px;border:0;background:transparent;text-align:left;padding:4px 8px;border-radius:5px;font-family:var(--f-mono);font-size:12px;width:100%}
.frow:hover{background:var(--panel-2)}
.frow[aria-current="true"]{background:var(--panel-2)}
.frow .s{width:12px;color:var(--wait);font-weight:600}
.frow .s.A{color:var(--run)}
.frow .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .st2{margin-left:auto;white-space:nowrap;font-size:11px}
.plus{color:var(--add)} .minus{color:var(--del)}
.frow.seen .n{color:var(--faint);text-decoration:line-through}
.dmain{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0}
.dhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.dhead .path{font-family:var(--f-mono);font-size:12.5px}
.dhead label{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dscroll{overflow:auto}
table.code{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:12.5px}
table.code td{padding:0 10px;white-space:pre;vertical-align:top}
table.code td.no{width:1%;color:var(--faint);text-align:right;user-select:none;padding:0 6px;font-variant-numeric:tabular-nums}
table.code td.cbtn{width:1%;padding:0 2px}
table.code td.cbtn button{opacity:0;border:0;background:var(--accent);color:var(--accent-ink);border-radius:3px;width:16px;height:16px;line-height:16px;padding:0;font-size:12px}
table.code tr:hover td.cbtn button,table.code td.cbtn button:focus-visible{opacity:1}
tr.add td.c{background:var(--add-bg)} tr.add td.c::before{content:"+ ";color:var(--add)}
tr.del td.c{background:var(--del-bg)} tr.del td.c::before{content:"− ";color:var(--del)}
tr.ctx td.c::before{content:"  "}
tr.hunk td{color:var(--accent);background:var(--panel-2);padding-block:2px}
tr.cm td{padding:6px 12px 8px 60px;white-space:normal}
.cbox{border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel-2);padding:8px 10px;font-family:var(--f-body);font-size:13px;max-width:640px;display:grid;gap:6px}
.cbox .who{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.cbox textarea{width:100%;min-height:60px;background:var(--sunk);border:1px solid var(--line-2);border-radius:5px;padding:6px 8px;resize:vertical}
.cbox .row{display:flex;gap:6px;justify-content:flex-end}
.dfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel)}
.dfoot input{flex:1;min-width:180px;background:var(--sunk);border:1px solid var(--line-2);border-radius:var(--r);padding:5px 9px}

/* App + Run */
.pane{padding:14px;display:grid;gap:12px;align-content:start}
.runners{display:flex;flex-wrap:wrap;gap:8px}
.runner{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:5px 6px 5px 10px;background:var(--panel-2)}
.runner .nm{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.running{background:var(--run)} .dot.ok{background:var(--done)} .dot.failed{background:var(--err)} .dot.pending{background:var(--wait)}
.note{font-size:12px;color:var(--muted);border-left:2px solid var(--wait);padding-left:8px}
.browser{border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.urlbar{display:flex;gap:8px;align-items:center;padding:6px 8px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.urlbar .url{flex:1;min-width:0;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-family:var(--f-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logs{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);max-height:150px;overflow:auto;white-space:pre-wrap}
.empty{padding:28px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
/* the mock web app inside the preview: its own fixed light look */
.mock{background:#fbfaf7;color:#22251f;font-family:var(--f-body);padding:18px 20px;min-height:260px}
.mock h3{margin:0 0 2px;font-size:16px}
.mock .sub{color:#6c6f66;font-size:12px;margin-bottom:14px}
.mock table{width:100%;border-collapse:collapse;font-size:13px}
.mock td,.mock th{padding:6px 8px;border-bottom:1px solid #e6e3da;text-align:left}
.mock th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6c6f66}
.mock .bar{height:6px;background:#e6e3da;border-radius:3px;overflow:hidden;width:120px}
.mock .bar i{display:block;height:100%;background:#4c7a46}
.mock .late{color:#b5462f;font-weight:600;font-size:12px}
table.cmds{width:100%;border-collapse:collapse}
table.cmds td,table.cmds th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.cmds th{font-weight:600}
.testsum{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Livraison */
.ship{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--panel-2);display:grid;gap:8px;align-content:start}
.card h3{margin:0;font-size:14px}
.card p{margin:0;color:var(--muted);font-size:12.5px}
.checks{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.checks li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.checks .r{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px}
.banner{border:1px solid var(--wait);border-radius:8px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:color-mix(in srgb,var(--wait) 7%,var(--panel))}
.banner.ok{border-color:var(--done);background:color-mix(in srgb,var(--done) 8%,var(--panel))}

/* View B : kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-height:0}
.col{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.col-h b{font-family:var(--f-label);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.col-h .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.col-b{overflow:auto;padding:10px;display:grid;gap:10px;align-content:start}
.kc{border:1px solid var(--line);border-radius:var(--r);background:var(--panel-2);padding:10px;display:grid;gap:7px;text-align:left;width:100%}
.kc:hover{border-color:var(--line-2)}
.kc.waiting{border-left:3px solid var(--wait)}
.kc .t{font-family:var(--f-mono);font-size:12.5px;display:flex;gap:6px;align-items:center;min-width:0}
.kc .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .q{font-size:12.5px;color:var(--fg)}
.kc .last{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;align-items:center}
.kc .meter{width:52px}
.kc .row{display:flex;gap:6px;flex-wrap:wrap}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.55);display:grid;place-items:center;z-index:20;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(820px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;display:grid}
.mh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:16px}
.mh .x{margin-left:auto}
.mb{padding:14px 16px;display:grid;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field select,.field input,.field textarea{background:var(--sunk);border:1px solid var(--line-2);border-radius:var(--r);padding:5px 8px;min-width:0;width:100%}
.field textarea{min-height:110px;font-family:var(--f-mono);font-size:12.5px;resize:vertical}
.hint{font-size:11.5px;color:var(--faint)}
.issues{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.issues .ih{display:flex;gap:8px;align-items:center;padding:7px 10px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.issues .ih input{margin-left:auto;background:var(--sunk);border:1px solid var(--line-2);border-radius:5px;padding:3px 8px;width:180px;max-width:50%}
.irow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.irow:last-child{border-bottom:0}
.irow:hover{background:var(--panel-2)}
.irow[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.irow .num{font-family:var(--f-mono);color:var(--muted);width:44px;flex:none;font-size:12.5px}
.irow .ti{min-width:0;flex:1}

/* ---------- État d'interface ---------- */
const S = {view:'projet', sel:'s2', tab:'terminal', file:{}, commenting:null, modal:null, notified:false, draft:{}, rec:null, settings:null, capture:null};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sess = id => SESSIONS.find(s => s.id === id);
const cur = () => sess(S.sel);
const prof = s => s.profile || PROJECTS[s.project].profile;
const money = n => n.toFixed(2).replace('.', ',') + ' $';
const ago = m => m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.round(m/60)} h` : 'hier';
const pct = s => Math.round(s.ctx / s.ctxMax * 100);
const meter = (p, w) => `<span class="meter"${w?` style="width:${w}px"`:''}><i class="${p>=90?'crit':p>=75?'hot':''}" style="width:${p}%"></i></span>`;
const st = s => `<span class="st ${s}" aria-hidden="true"></span>`;
const diffStat = s => { const f = DIFFS[s.diff] || []; let a=0,d=0; f.forEach(x => x.lines.forEach(l => { if(l[0]==='a')a++; if(l[0]==='d')d++; })); return {n:f.length,a,d}; };
const issueOf = s => s.issue && (ISSUES[s.project]||[]).flatMap(i => [i, ...(i.subs||[])]).find(i => i.n === s.issue);
const lastLine = s => { const t = [...s.term].reverse().find(l => l[0]==='claude' || l[0]==='sys'); return t ? t[1] : ''; };
const failedCount = s => Object.values(s.run).filter(v => v==='failed').length;
const sessionsOnIssue = (pid, n) => SESSIONS.filter(s => s.project===pid && s.issue===n);

    return `<div class="proj">

    <nav class="panel side" aria-label="Projets et sessions">
      <div class="cap"><span class="lbl">Projets</span><span class="hint">regroupés par dépôt git</span></div>
      ${side}
      <div class="old"><div class="cap"><span class="lbl">Anciennes sessions</span><span class="hint">à reprendre</span></div>${olds}</div>
    </nav>
    ${sessionPane(cur())}
  </main>`;
}

          ${s.status==='running' ? '<button class="btn sm ghost" data-act="interrupt" title="Échap">Interrompre</button>' : ''}

        </div>
      </div>

function diffView(s){
  const files = DIFFS[s.diff];
  if(!files) return `<div class="empty"><b>Aucune modification</b><span>La branche ${esc(s.branch)} est identique à main.</span></div>`;
  s.viewed ||= {}; s.comments ||= [];
  const fi = S.file[s.id] || 0, f = files[fi];
  const rows = f.lines.map((l, i) => {
    const cms = s.comments.filter(c => c.f===f.p && c.i===i);
    const cmHtml = cms.map((c, ci) => `<tr class="cm"><td colspan="5"><div class="cbox"><div class="who"><span>Toi · commentaire en attente</span><button class="btn sm ghost" data-act="del-comment" data-i="${s.comments.indexOf(c)}" aria-label="Supprimer le commentaire">×</button></div>${esc(c.txt)}</div></td></tr>`).join('');
    const editing = S.commenting && S.commenting.f===f.p && S.commenting.i===i;
    const form = editing ? `<tr class="cm"><td colspan="5"><form class="cbox" data-form="comment"><textarea id="cm-text" placeholder="Ton commentaire sur cette ligne…" aria-label="Commentaire"></textarea><div class="row"><button type="button" class="btn sm ghost" data-act="cancel-comment">Annuler</button><button class="btn sm pri">Ajouter à la revue</button></div></form></td></tr>` : '';
    if(l[0]==='h') return `<tr class="hunk"><td class="cbtn"></td><td class="no"></td><td class="no"></td><td class="c" colspan="2">${esc(l[1])}</td></tr>`;
    const cls = {a:'add', d:'del', c:'ctx'}[l[0]];
    return `<tr class="${cls}"><td class="cbtn"><button data-act="comment" data-i="${i}" aria-label="Commenter la ligne">+</button></td><td class="no">${l[1]??''}</td><td class="no">${l[2]??''}</td><td class="c">${esc(l[3])}</td><td></td></tr>${cmHtml}${form}`;
  }).join('');
  const seen = files.filter(x => s.viewed[x.p]).length, n = s.comments.length;
  return `<div class="diff">
    <div class="files" role="list">
      <div class="lbl" style="padding:2px 8px 6px">${seen}/${files.length} fichiers vus</div>
      ${files.map((x, i) => { let a=0,d=0; x.lines.forEach(l => {if(l[0]==='a')a++; if(l[0]==='d')d++;}); const c = s.comments.filter(k => k.f===x.p).length;
        return `<button class="frow${s.viewed[x.p]?' seen':''}" data-act="file" data-i="${i}" aria-current="${i===fi}"><span class="s ${x.s}">${x.s}</span><span class="n" title="${esc(x.p)}">${esc(x.p.split('/').pop())}</span><span class="st2">${c?`💬${c} `:''}<span class="plus">+${a}</span> <span class="minus">−${d}</span></span></button>`; }).join('')}
    </div>
    <div class="dmain">
      <div class="dhead"><span class="path">${esc(f.p)}</span><span class="hint">survole une ligne et clique sur + pour commenter</span>
        <label><input type="checkbox" id="seen-${s.id}-${fi}" data-act="seen" ${s.viewed[f.p]?'checked':''}> Vu</label></div>
      <div class="dscroll"><table class="code">${rows}</table></div>
      <form class="dfoot" data-form="review">
        <input id="review-${s.id}" placeholder="Commentaire général (facultatif)" aria-label="Commentaire général">
        <button class="btn pri" ${n?'':'disabled'}>Envoyer la revue à Claude${n?` (${n})`:''}</button>
      </form>
    </div>
  </div>`;
}

function branchFor(i){ const pre = {bug:'fix', perf:'perf', epic:'feat'}[i.tag] || 'feat'; return `${pre}/${i.n}-${slug(i.t)}`; }

function issueList(issues){

    const on = sessionsOnIssue(m.project, i.n).length;

function syncModalFields(){
  const m = S.modal; if(!m) return;
  const g = id => document.getElementById(id);
  if(g('m-profile')) m.profile = g('m-profile').value;
  if(g('m-model')) m.model = g('m-model').value;
  if(g('m-mode')) m.mode = g('m-mode').value;
  if(g('m-branch') && !g('m-branch').disabled) m.branch = g('m-branch').value;
  if(g('m-prompt')) m.prompt = g('m-prompt').value;
  if(g('m-wtmode')) m.wtMode = g('m-wtmode').value;

function promptFor(i, p){ return `Traite l'issue #${i.n} « ${i.t} ».\n\n${i.body || ''}\n\nhttps://github.com/${p.repo}/issues/${i.n}`; }

function launch(){
  syncModalFields();
  const m = S.modal, p = PROJECTS[m.project];
  let created = [];
  const mk = (branch, issue, prompt, extra=[]) => {
    const id = 's' + (SESSIONS.length + 1) + Math.random().toString(36).slice(2,5);
    const wt = m.src!=='resume' && m.wt;
    const term = [];
    if(wt) term.push(['tool', `<b>Bash</b>(git worktree add ${esc(wtPathM({...m, branch}))} -b ${esc(branch)})`], ['out', 'worktree prêt']);
    term.push(...extra, ['user', prompt || '(session ouverte)'], ['claude', "Je lis le contexte et j'explore le code concerné…"]);
    SESSIONS.push({id, project:m.project, profile:m.profile, branch, wt, model:m.model, mode:m.mode, status:'running', ctx:4, ctxMax:200, cost:0, tokens:'8k', last:0, issue, diff:null, run:Object.fromEntries(p.runners.map(r => [r.n,'idle'])), term});
    created.push(id);
  };
  if(m.src==='resume'){
    const o = (OLD[m.project]||[]).find(x => x.id===m.resume);
    mk('main', null, null, [['sys', `$ claude --resume ${o.id}`], ['sys', `Reprise de « ${o.t} » · ${o.m} messages`]]);
    SESSIONS[SESSIONS.length-1].term.splice(-2, 2, ['claude', 'Session reprise. Où en étions-nous : on finit la migration ou on passe aux tests ?']);
    SESSIONS[SESSIONS.length-1].status = 'idle';
  } else if(m.src==='issue'){
    const i = (ISSUES[m.project]||[]).find(x => x.n===m.issue);
    if(i.subs && m.subs.length) i.subs.filter(x => m.subs.includes(x.n)).forEach(x => mk(branchFor({...x, tag:'feature'}), x.n, promptFor({...x, body:`Sous-issue de l'épique #${i.n} « ${i.t} ».`}, p)));
    else mk(m.branch || branchFor(i), i.n, m.prompt);
  } else mk(m.branch || 'feat/session-' + Math.random().toString(36).slice(2,6), null, m.prompt);
  S.modal = null; renderModal();
  S.view = 'projet'; S.sel = created[0]; S.tab = 'terminal'; render();
  toast(created.length>1 ? `${created.length} sessions lancées` : 'Session lancée', `${p.name} · ${sess(created[0]).branch}`);
}

function filesOf(s){
  const name = PROJECTS[s.project].name;
  const all = {...(PFILES[s.project] || {'README.md':`# ${name}\n\nREADME d'exemple pour ce prototype.\n\n## Démarrer\n\nVoir les commandes détectées dans l'onglet Run / Tests.`, 'CLAUDE.md':'# Consignes pour Claude\n\n- Lancer les tests avant de rendre la main.'})};
  (DIFFS[s.diff] || []).forEach(f => { if(!(f.p in all)) all[f.p] = null; });
  return all;
}
const changeOf = (s, p) => ((DIFFS[s.diff] || []).find(x => x.p===p) || {}).s || null;
function ftOf(s){
  S.ft ||= {};
  if(!S.ft[s.id]){
    const open = new Set(['docs']);
    (DIFFS[s.diff] || []).forEach(f => { const parts = f.p.split('/'); for(let i = 1; i < parts.length; i++) open.add(parts.slice(0, i).join('/')); });
    S.ft[s.id] = {open, file:'README.md', raw:false, filter:''};
  }
  return S.ft[s.id];
}
function fileContent(s, p){
  const v = filesOf(s)[p]; if(v != null) return v;
  const f = (DIFFS[s.diff] || []).find(x => x.p===p);
  if(f) return f.lines.filter(l => l[0]==='a' || l[0]==='c').map(l => l[3]).join('\n') + '\n\n// … (extrait : seules les lignes du diff sont connues du prototype)';
  return `// ${p}\n// Contenu d'exemple : le vrai fichier est lu depuis le worktree.`;
}
const icon = p => p.endsWith('.md') ? '¶' : p.endsWith('.go') ? 'go' : p.endsWith('.ts') ? 'ts' : p.endsWith('.gd') ? 'gd' : '·';
function treeList(s){

function comboOf(e){
  const k = [];
  if(e.ctrlKey) k.push('Ctrl'); if(e.altKey) k.push('Alt'); if(e.shiftKey) k.push('Maj'); if(e.metaKey) k.push('Super');
  if(!['Control','Alt','Shift','Meta','AltGraph'].includes(e.key)) k.push(e.code==='Space' ? 'Espace' : e.key.length===1 ? e.key.toUpperCase() : e.key);
  return k.join('+');
}

    <div class="stabs" role="tablist">${[['apparence','Apparence'],['voix','Voix et raccourcis']].map(([k,l]) => `<button role="tab" data-act="settings" data-t="${k}" aria-selected="${t===k}">${l}</button>`).join('')}</div>
    <div class="mb">${body}</div>
    ${t==='apparence' ? `<div class="mf"><span class="sum">Les réglages sont propres à chaque personne.</span><button class="btn ghost" data-act="theme-reset">Réinitialiser les couleurs</button><button class="btn" data-act="theme-copy">Copier le thème (JSON)</button></div>` : ''}
  </div></div>`;
}

/* ---------- Actions ---------- */
function toast(t, tx, opt={}){
  const el = document.createElement('div');
  el.className = 'toast' + (opt.wait ? ' wait' : '');
  el.innerHTML = `<div class="tt">${esc(t)}</div>${tx?`<div class="tx">${esc(tx)}</div>`:''}${opt.go?`<div class="row"><button class="btn sm pri" data-act="sel" data-id="${opt.go}">Voir</button></div>`:''}`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), opt.wait ? 9000 : 3500);
}
function push(s, ...lines){ s.term.push(...lines); s.last = 0; }
function later(fn, ms){ setTimeout(() => { fn(); render(); }, ms); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.tagName==='A' && b.getAttribute('href')==='#') e.preventDefault();
  const a = b.dataset.act, s = cur();
  if(['mode','seen','autofix','m-wt','pick-sub'].includes(a)) return; // handled by change
  if(a==='close-scrim' && e.target !== b) return;
  switch(a){
    case 'view': S.view = b.dataset.v; break;
    case 'sel': S.sel = b.dataset.id; S.view = 'projet'; if(!b.closest('.tabs')) S.tab = sess(S.sel).status==='done' ? 'ship' : 'terminal'; break;
    case 'open': S.sel = b.dataset.id; S.view = 'projet'; { const x = sess(S.sel); S.tab = x.status==='done' ? 'ship' : 'terminal'; } break;
    case 'next-wait': { const w = SESSIONS.find(x => x.status==='waiting'); if(w){ S.sel = w.id; S.view = 'projet'; S.tab = 'terminal'; } } break;
    case 'tab': S.tab = b.dataset.t; S.commenting = null; break;
    case 'allow': case 'always':
      push(s, ['sys', a==='always' ? `Règle ajoutée au projet : ${s.pending.tool}(${s.pending.cmd.split(' ')[0]} …)` : `Autorisé : ${s.pending.cmd}`], ['tool', `<b>${esc(s.pending.tool)}</b>(${esc(s.pending.cmd)})`]);
      s.pending = null; s.status = 'running';
      later(() => { push(s, ['out', 'ok  \tchantier/internal/planning\t0.402s'], ['claude', 'Tous les tests passent. Je relis le diff avant de te rendre la main.']); s.run.test = 'ok'; }, 1400);
      break;
    case 'deny': push(s, ['sys', `Refusé : ${s.pending.cmd}`], ['claude', 'Compris, je ne lance pas les tests. Je te laisse les lancer depuis l’onglet Run / Tests.']); s.pending = null; s.status = 'idle'; break;
    case 'answer': push(s, ['user', b.dataset.a]); s.pending = null; s.status = 'running'; later(() => push(s, ['claude', `Parfait, je pars sur : ${b.dataset.a.toLowerCase()}.`]), 1000); break;
    case 'focus-compose': document.getElementById('compose-' + s.id)?.focus(); return;
    case 'interrupt': push(s, ['sys', 'Interrompu (Échap) · en attente de ton message']); s.status = 'idle'; break;
    case 'stop': push(s, ['sys', 'Session arrêtée']); s.status = 'idle'; break;
    case 'file': S.file[s.id] = +b.dataset.i; S.commenting = null; break;
    case 'comment': S.commenting = {f: DIFFS[s.diff][S.file[s.id]||0].p, i: +b.dataset.i}; render(); document.getElementById('cm-text')?.focus(); return;
    case 'cancel-comment': S.commenting = null; break;
    case 'del-comment': s.comments.splice(+b.dataset.i, 1); break;
    case 'run': {
      const r = PROJECTS[s.project].runners.find(x => x.n===b.dataset.n), v = s.run[r.n];
      if(r.kind==='server' || r.kind==='native'){ s.run[r.n] = v==='running' ? 'idle' : 'running'; if(s.run[r.n]==='running') toast(`${r.n} lancé`, r.cmd); }
      else { s.run[r.n] = 'running'; later(() => { s.run[r.n] = TEST_OUT[s.id] && r.n==='test' ? 'failed' : 'ok'; }, 1300); }
    } break;
    case 'send-fail': push(s, ['user', 'Les tests échouent : TestCallbackStateExpire et TestCallbackStateInconnu. Sortie jointe, corrige.']); s.status = 'running'; S.tab = 'terminal';
      later(() => push(s, ['claude', 'Le test attend 400 mais ValidState panique sur un state vide. Je corrige parseCode.'], ['tool', '<b>Update</b>(internal/auth/oauth.go)'], ['out', '+3 −1']), 1200); break;
    case 'make-pr': push(s, ['user', 'Ouvre la PR pour cette branche' + (issueOf(s) ? ` (Closes #${s.issue})` : '')], ['tool', '<b>Bash</b>(git push -u origin ' + esc(s.branch) + ')']); s.status = 'running';
      later(() => { push(s, ['tool', '<b>Bash</b>(gh pr create --title … --body …)'], ['out', `https://github.com/${PROJECTS[s.project].repo}/pull/61`]); s.status = 'done'; s.ship = {state:'pr', pr:61, ci:[['build','running','en cours'],['test','pending','en attente'],['lint','pending','en attente']], autofix:true}; S.tab = 'ship'; toast('PR #61 ouverte', 'La CI démarre, l’app la suit.'); }, 1500); break;
    case 'merge-main': push(s, ['user', 'Rebase sur main et merge en fast-forward'], ['tool', '<b>Bash</b>(git fetch && git rebase origin/main)']); s.status = 'running';
      later(() => { push(s, ['tool', '<b>Bash</b>(git push origin HEAD:main)'], ['out', 'main mis à jour (fast-forward)']); s.status = 'done'; s.ship = {state:'merged', how:'main', ago:"à l'instant"}; S.tab = 'ship'; toast('Mergée dans main', 'Le worktree peut être supprimé.'); }, 1500); break;
    case 'merge-pr': s.ship = {state:'merged', how:'pr', ago:"à l'instant"}; toast(`PR #${s.ship.pr||''} mergée`); break;
    case 'cleanup': { const p = PROJECTS[s.project]; SESSIONS = SESSIONS.filter(x => x !== s); S.sel = SESSIONS[0].id; S.tab = 'terminal'; toast('Worktree supprimé', `${p.name} · ${s.branch} : worktree et branche locale supprimés`); } break;
    case 'toast': toast(b.dataset.m); return;
    case 'resume': openModal({project:b.dataset.p, src:'resume', resume:b.dataset.id}); return;
    case 'new': openModal(); return;
    /* thèmes */
    case 'theme-mode': THEME.mode = b.dataset.m; applyTheme(); if(S.settings) renderSettings(); break;
    case 'settings': S.settings = {tab:b.dataset.t}; S.capture = null; renderSettings(); return;
    case 'preset': THEME.preset = b.dataset.p; applyTheme(); renderSettings(); return;
    case 'theme-reset': THEME.custom = {light:{}, dark:{}}; applyTheme(); renderSettings(); toast('Couleurs réinitialisées'); return;
    case 'theme-copy': try { navigator.clipboard.writeText(JSON.stringify(THEME, null, 2)).then(() => toast('Thème copié', 'À coller dans le fichier de thème ou à partager.'), () => toast('Copie refusée par le navigateur')); } catch(_) { toast('Copie refusée par le navigateur'); } return;
    /* voix */
    case 'model': { const k = b.dataset.k; if(!VOICE.installed.includes(k)){ VOICE.installed.push(k); toast('Modèle téléchargé (simulé)', MODELS[k].nom); } VOICE.model = k; saveVoice(); renderSettings(); } return;
    case 'capture': S.capture = b.dataset.k; renderSettings(); return;
    case 'pttmode': VOICE.pttMode = b.dataset.v; saveVoice(); renderSettings(); render(); return;
    case 'mic': startRec('long'); return;
    case 'rec-cancel': S.rec = null; break;
    case 'rec-review': finishLong(false); return;
    case 'rec-send': finishLong(true); return;
    /* fichiers */
    case 'fdir': { const f = ftOf(s), p = b.dataset.p; f.open.has(p) ? f.open.delete(p) : f.open.add(p); } break;
    case 'fopen': ftOf(s).file = b.dataset.p; ftOf(s).raw = false; S.tab = 'files'; break;
    case 'fraw': ftOf(s).raw = b.dataset.v==='1'; break;
    case 'ftoc': document.getElementById(b.dataset.h)?.scrollIntoView({block:'start'}); return;
    case 'fmention': S.draft[s.id] = ((S.draft[s.id]||'') + ' @' + ftOf(s).file).trim(); S.tab = 'terminal'; toast('Fichier mentionné', '@' + ftOf(s).file + ' ajouté au message'); break;
    case 'fedit': toast("Ouverture dans l'éditeur (simulé)", ftOf(s).file); return;
    /* modal */
    case 'close': case 'close-scrim': S.modal = null; S.settings = null; S.capture = null; renderModal(); return;
    case 'm-src': syncModalFields(); S.modal.src = b.dataset.s; if(b.dataset.s==='free'){ S.modal.issue = null; S.modal.prompt = ''; S.modal.branch = ''; } renderModal(); return;
    case 'pick-issue': { syncModalFields(); const m = S.modal, i = ISSUES[m.project].find(x => x.n===+b.dataset.n); m.issue = i.n; m.subs = i.subs ? i.subs.map(x => x.n) : []; m.branch = branchFor(i); m.prompt = promptFor(i, PROJECTS[m.project]); renderModal(); } return;
    case 'pick-resume': S.modal.resume = b.dataset.id; renderModal(); return;
    case 'launch': launch(); return;
  }
  render();
});

document.addEventListener('change', e => {
  const t = e.target, s = cur();
  if(t.dataset.act==='mode'){ s.mode = t.value; push(s, ['sys', `Mode changé : ${MODES.find(m => m[0]===t.value)[1]}`]); render(); return; }
  if(t.dataset.act==='seen'){ const f = DIFFS[s.diff][S.file[s.id]||0]; s.viewed[f.p] = t.checked; render(); return; }
  if(t.dataset.act==='autofix'){ s.ship.autofix = t.checked; return; }
  if(t.dataset.tok){ renderSettings(); return; }
  if(t.id==='v-pttmode'){ VOICE.pttMode = t.value; saveVoice(); return; }
  if(t.name==='after'){ VOICE.after = t.value; saveVoice(); return; }
  if(t.id==='v-pre'){ VOICE.preamble = t.checked; saveVoice(); return; }
  if(t.id==='v-keep'){ VOICE.keepAudio = t.checked; saveVoice(); return; }
  if(!S.modal) return;
  if(t.id==='m-project'){ const pid = t.value; Object.assign(S.modal, {project:pid, profile:PROJECTS[pid].profile, wtMode:PROJECTS[pid].wt, issue:null, subs:[], branch:'', prompt:'', resume:null}); renderModal(); return; }
  if(t.dataset.act==='m-wt'){ syncModalFields(); S.modal.wt = t.checked; renderModal(); return; }
  if(t.dataset.act==='pick-sub'){ syncModalFields(); const n = +t.dataset.n, a = S.modal.subs; t.checked ? a.push(n) : a.splice(a.indexOf(n), 1); renderModal(); return; }
  if(['m-profile','m-wtmode'].includes(t.id)){ syncModalFields(); renderModal(); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.tok){ const m = resolved(); THEME.custom[m][t.dataset.tok] = t.value; applyTheme(); const h = t.parentElement.querySelector('.hex'); if(h) h.textContent = t.value; return; }
  if(t.id && t.id.startsWith('compose-')){ S.draft[t.id.slice(8)] = t.value; return; }
  if(t.id && t.id.startsWith('ffilter-')){ const s = cur(); ftOf(s).filter = t.value; $('#ftree-list').innerHTML = treeList(s); return; }
  if(e.target.id==='issue-filter'){ S.modal.filter = e.target.value; const list = (ISSUES[S.modal.project]||[]).filter(i => (i.t+' '+i.n).toLowerCase().includes(S.modal.filter.toLowerCase())); $('#issue-list').innerHTML = issueList(list); }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form, s = cur();
  if(f==='compose'){ const inp = document.getElementById('compose-' + s.id), v = inp.value.trim(); if(!v) return;
    S.draft[s.id] = ''; push(s, ['user', v]); s.pending = null; s.status = 'running'; render(); later(() => push(s, ['claude', 'Bien noté, je m’en occupe.']), 1000); }
  if(f==='comment'){ const v = document.getElementById('cm-text').value.trim(); if(v){ s.comments.push({f:S.commenting.f, i:S.commenting.i, txt:v}); } S.commenting = null; render(); }
  if(f==='review'){ const g = document.getElementById('review-' + s.id).value.trim(), n = s.comments.length;
    const lines = s.comments.map(c => { const l = DIFFS[s.diff].find(x => x.p===c.f).lines[c.i]; return `${c.f}:${l[2]??l[1]} — ${c.txt}`; });
    push(s, ['user', `Revue du diff (${n} commentaire${n>1?'s':''})${g?' : '+g:''}\n` + lines.map(x => '• ' + x).join('\n')]);
    s.comments = []; s.status = 'running'; S.tab = 'terminal'; render();
    toast('Revue envoyée à Claude', `${PROJECTS[s.project].name} · ${s.branch}`);
    later(() => push(s, ['claude', 'Je prends en compte la revue, je commence par ' + lines[0].split(' — ')[0] + '.']), 1200); }
});

document.addEventListener('submit', e => {
  if(e.target.dataset.form==='rec-send') sendDictation(document.getElementById('rec-edit').value, document.getElementById('rec-pre').checked);
});

const MODS = ['Ctrl','Alt','Maj','Super'];
document.addEventListener('keydown', e => {
  if(S.capture){
    e.preventDefault();
    if(e.key==='Escape'){ S.capture = null; renderSettings(); return; }
    const c = comboOf(e); if(!c || c.split('+').every(p => MODS.includes(p))) return;
    VOICE[S.capture] = c; saveVoice(); S.capture = null; renderSettings(); render(); toast('Raccourci enregistré', c); return;
  }
  const c = comboOf(e), busy = S.modal || S.settings;
  if(c===VOICE.ptt){
    e.preventDefault(); if(e.repeat) return;
    if(S.rec && S.rec.kind==='ptt'){ if(VOICE.pttMode==='toggle') stopPtt(); return; }
    if(!S.rec && !busy) startRec('ptt'); return;
  }
  if(c===VOICE.long){
    e.preventDefault(); if(e.repeat) return;
    if(S.rec && S.rec.kind==='long' && !S.rec.review) finishLong(VOICE.after==='send');
    else if(!S.rec && !busy) startRec('long');
    return;
  }
  if(e.key==='Escape'){
    if(S.rec && !S.rec.review){ S.rec = null; $('#ptt').hidden = true; render(); return; }
    if(busy){ S.modal = null; S.settings = null; renderModal(); }
  }
});
document.addEventListener('keyup', () => { if(S.rec && S.rec.kind==='ptt' && VOICE.pttMode==='hold') stopPtt(); });

applyTheme();
render();
/* Notification simulée : une session passe en attente */
setTimeout(() => {
  const s = sess('s6'); if(!s || s.status!=='running') return;
  s.status = 'waiting'; s.last = 0;
  s.pending = {type:'question', text:"Je stocke l'état des sessions dans SQLite ou dans des fichiers JSON par session ?", opts:['SQLite','Fichiers JSON']};
  push(s, ['claude', 'Le PTY fonctionne et les hooks arrivent sur le socket. Avant de persister l’état, une question.']);
  render();
  toast('orchestrateur · main attend ta réponse', 'Notification desktop · le son est joué par peon-ping', {wait:true, go:'s6'});
}, 8000);
</script>
