[package]
name = "bench-core"
version = "0.1.0"
edition = "2021"
publish = false

# Logique sans dépendance système (générateur, statistiques, /proc, rapport) :
# se teste avec `cargo test -p bench-core`, même sans WebKitGTK installé.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
