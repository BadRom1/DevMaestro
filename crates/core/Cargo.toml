[package]
name = "devmaestro-core"
description = "Domaine, ports et adaptateurs de DevMaestro, et binaire du démon `orchd`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "devmaestro_core"
path = "src/lib.rs"

[[bin]]
name = "orchd"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
